# Web Hosting Security Agent Configuration
# ==========================================

[general]
# Server name (appears in the dashboard)
server_name = server1

# How often to run security checks (in seconds)
check_interval = 60

# How often to report server health status (in seconds)
status_interval = 300

# Enable/disable individual checks
enable_ssh_guard = true
enable_apache_guard = true
enable_port_scan = true
enable_process_monitor = true
enable_file_integrity = true
enable_server_shield = true

# Log file location
log_file = /var/log/hosting-agent/agent.log

# Agent API key (must match .env AGENT_API_KEY on the dashboard server)
agent_api_key = CHANGE_ME

# Dashboard API URL (where the Laravel app is hosted)
# Leave empty to disable dashboard reporting (Telegram only)
api_url = https://your-dashboard.example.com/api/agent

[telegram]
# Enable Telegram notifications
enabled = true

# Telegram Bot API token (from @BotFather)
bot_token = CHANGE_ME

# Chat ID to send alerts to (can be group or user chat)
chat_id = CHANGE_ME

# Minimum severity to send real-time alerts (critical, high, medium, low, info)
min_alert_level = medium

# Send daily summary report (true/false)
daily_summary = true
# Hour of day (0-23) to send daily summary, server local time
daily_summary_hour = 9

[ssh_guard]
# Block IP after this many failed login attempts
max_failed_attempts = 5

# Time window in seconds to count attempts
attempt_window = 300

# Block duration in seconds (0 = permanent until manually removed)
block_duration = 86400

[apache_guard]
# Block IP after this many suspicious requests
max_suspicious_requests = 20

# Time window in seconds
attempt_window = 300

# Apache access log location
apache_access_log = /usr/local/apache/logs/access_log

# Apache error log location
apache_error_log = /usr/local/apache/logs/error_log

# Block duration in seconds
block_duration = 86400

[port_scan]
# Allowed ports (comma-separated)
allowed_ports = 21,22,25,80,110,143,443,465,587,993,995,2082,2083,2086,2087,2095,2096,3306

# Ports that if open indicate a compromise
# Comma-separated list of known-dangerous ports (e.g., mining, malware C2)
dangerous_ports = 3333,4444,5555,6666,7777,8888,9999,31337,45000

# Re-scan interval in seconds (port scans can be slow)
scan_interval = 300

[process_monitor]
# Known crypto miner processes / binary names (comma-separated)
miner_keywords = xmrig,minergate,cpuminer,cgminer,bfgminer,kryptex,nicehash,dogecoin_miner
# Known webshell / backdoor process keywords
backdoor_keywords = nc,netcat,nikto,sqlmap,hydra,medusa,metasploit,msfconsole
# Suspicious process count threshold
suspicious_localhost_connections = 10

[file_integrity]
# cPanel user home directory
home_base = /home

# PHP files that contain these dangerous functions (comma-separated)
dangerous_functions = eval,base64_decode,shell_exec,system,exec,passthru,proc_open,popen,assert,create_function

# Maximum file size to scan (bytes) - skip huge files
max_scan_size = 5242880

# Directories to exclude (e.g., vendor, backups)
exclude_dirs = vendor,node_modules,wp-admin,wp-includes,mail,etc,cache,tmp,logs

[ip_blocker]
# Block method: iptables, firewalld, or csf
# csf is recommended for cPanel servers (uses csf -d IP command)
block_method = csf

# Whitelist file location
whitelist_file = /etc/hosting-agent/whitelist.txt

# Whether to also block in cPanel/WHM firewall (uses whmapi1)
sync_with_whm = true

[server_shield]
# Server Resource Shield: protects the host against runaway processes that
# spike CPU/load (coin miners, compromised PHP loops, mass-spawned shells).
# SAFE-BY-DEFAULT: it only flags/acts on processes that are NOT in the
# protected allowlist (mysqld, httpd, php-fpm, cpanel core, etc.).
enabled = true

# A process must exceed this %CPU (ps aux) to be considered for action.
cpu_threshold = 50

# System load (1-min) must exceed this many times the CPU core count before
# the shield engages. e.g. 4.0 on 1 core = load > 4.0. Lower to act sooner.
load_threshold = 4.0

# How long (seconds) the process must sustain high CPU before action.
min_duration = 60

# Whether to automatically kill the offending process (SIGTERM->SIGKILL).
# Start with false to review alerts first, then enable once verified.
auto_kill = false

# Process basenames that must NEVER be auto-killed (protects the control
# plane). Leave the defaults; only add more if needed.
protected = mysqld,mariadbd,httpd,apache2,nginx,php-fpm,php-cgi,cpsrvd,cpdavd,tailwatchd,exim,dovecot,sshd,crond,srs,qmail,imapd,xinetd,named,systemd,kerneloops,logger,lxcfs,java,lsphp,lsapi,pure-ftpd,vsftpd,cpanellogd,spamd,redis-server,memcached,postgres

# Service/system users that are exempt from action.
exclude_users = root,bin,daemon,sys,adm,mail,news,uucp,games,www-data,nobody

